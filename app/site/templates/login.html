<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация | Стратегическая карта</title>

    <!-- Подключение шрифтов -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400..700&family=Reggae+One&display=swap" rel="stylesheet">

    <!-- Подключение внешнего файла стилей -->
    <link rel="stylesheet" href="/site/css/style.css">
</head>
<body>

    <div class="login-container">
        <div class="logo-wrapper">
            <img src="/site/img/logo.webp" alt="Логотип Стратегической Карты">
        </div>

        <div class="login-header">
            <h2>Как вас представить?</h2>
        </div>

        {% if error_message %}
            <div class="error-message">
                {{ error_message }}
            </div>
        {% endif %}

        <form method="POST" action="">
<input type="hidden" name="csrf" value="{{ csrf }}">
            <div class="form-group">
                <label for="login">Логин</label>
                <input type="text" id="login" name="login" required autocomplete="username" placeholder="Введите ваш логин">
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Введите пароль">
                    <button type="button" class="toggle-password" aria-label="Показать пароль">
                        <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Войти</button>
        </form>

        <div class="form-footer">
           Ты ту впервые? Или контузия?<br /> <a id="open-register" href="/register.php">Ну расскажы о себе!</a>
        </div>
    </div>

    <dialog id="register-dialog" style="width:min(560px,calc(100vw - 32px));height:min(780px,calc(100vh - 32px));padding:0;border:0;border-radius:16px;overflow:hidden">
        <button id="close-register" type="button" aria-label="Закрыть" style="position:absolute;z-index:2;right:12px;top:8px;font-size:2rem">×</button>
        <iframe title="Регистрация" style="width:100%;height:100%;border:0" loading="lazy"></iframe>
    </dialog>

    <script>
        const toggleBtn = document.querySelector('.toggle-password');
        const passwordInput = document.getElementById('password');

        if (toggleBtn && passwordInput) {
            toggleBtn.addEventListener('click', function() {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';

                this.innerHTML = isPassword
                    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
                    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
            });
        }
        const registerDialog = document.getElementById('register-dialog');
        document.getElementById('open-register').addEventListener('click', (event) => {
            event.preventDefault();
            registerDialog.querySelector('iframe').src = event.currentTarget.href;
            registerDialog.showModal();
        });
        document.getElementById('close-register').addEventListener('click', () => registerDialog.close());
        registerDialog.addEventListener('click', (event) => { if (event.target === registerDialog) registerDialog.close(); });
    </script>

</body>
</html>
