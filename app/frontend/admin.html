<!doctype html>
<!-- Release review 2026-09-18 (0.0.2): Hex administration controls and navigation to account management.
     Details: docs/releases/0.0.2-changes-2026-09-18.md. -->
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rhisseth — таблица гексов</title><link rel="stylesheet" href="/interactive-map/styles.css?v=hex-metadata-1"><script src="/interactive-map/admin.js?v=hex-metadata-1" defer></script></head>
<body><header class="topbar"><h1>Таблица гексов</h1><a href="/interactive-map/">Вернуться на карту</a></header><main>
<p>Изменения характеристик сохраняются в таблице. Изображение карты остаётся прежним.</p>
<div class="admin-controls"><label>Поиск <input id="search" type="search" placeholder="Название, координаты, ландшафт"></label><a href="/api/admin/hexes/export">Скачать CSV</a><button id="group-name" type="button">Название выбранных гексов</button><button id="group-territory" type="button">Создать / изменить владение</button></div>
<p id="admin-status" role="status"></p><div class="table-scroll"><table><thead id="columns"></thead><tbody id="rows"></tbody></table></div>
<section id="editor" class="admin-editor" hidden><h2 id="editor-title"></h2><form id="admin-form"></form></section>
<section id="territory-editor" class="admin-editor" hidden><h2>Компьютерное владение</h2><p>Выберите в таблице 2–10 соседних гексов. Баронство: 2–3, княжество: 4–6, королевство: 7–10.</p><form id="territory-form"><label>ID существующего владения (пусто — новое)<input name="id" type="number" min="1"></label><label>Название<input name="name" maxlength="200" required></label><label>Правила компьютерного игрока<textarea name="rules" maxlength="4000"></textarea></label><button type="submit">Подтвердить назначение</button><button type="button" id="cancel-territory">Отмена</button></form></section>
</main></body></html>
