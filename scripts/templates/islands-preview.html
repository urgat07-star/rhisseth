<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rhisseth — сравнение островов</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI",sans-serif;color:#eef0e6;background:#12202a}
*{box-sizing:border-box}body{margin:0}header{padding:20px clamp(14px,3vw,40px);background:#152a36;border-bottom:1px solid #56717a}
h1{margin:0 0 8px;font:26px Georgia,serif}p{margin:8px 0;color:#ccd7db;line-height:1.5}a{color:#b7dcf3}
.controls{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;margin-top:14px}
button{padding:10px 16px;border:1px solid #92a7a8;border-radius:5px;background:#263d48;color:#fff;font:inherit;cursor:pointer}
button[aria-pressed="true"]{background:#d7e2b7;color:#1c2a25;border-color:#d7e2b7}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffe39b;outline-offset:3px}
label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}input{accent-color:#d7e2b7}
main{padding:14px}.map-stage{position:relative;max-width:1800px;margin:0 auto;overflow:hidden;border:1px solid #56717a;background:#126dac}
img{width:100%;display:block}svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#grid-lines polygon{fill:none;stroke:#172b38;stroke-width:2}
#cell-labels text{fill:#eff7fd;font-size:18px;text-anchor:middle;paint-order:stroke;stroke:#173c54;stroke-width:4px}
#cell-labels,#move-guides{display:none}#mode{margin-bottom:12px;font-weight:600;color:#d7e2b7}
</style>
</head>
<body data-preview="programmatic-islands-v2">
<header>
<h1>Острова внутри гексов</h1>
<p>Небольшие острова сдвинуты ровно настолько, чтобы линии сетки не пересекали берег. Форма и рисунок островов сохранены.</p>
<p><a href="/interactive-map/" target="_blank" rel="noopener">Открыть основную интерактивную карту</a></p>
<div class="controls">
<button id="before" type="button" aria-pressed="false">Оригинал</button>
<button id="after" type="button" aria-pressed="true">Минимальные смещения</button>
<label><input id="grid" type="checkbox" checked>Гекс-сетка</label>
<label><input id="labels" type="checkbox">Подписи Q/R</label>
<label><input id="moves" type="checkbox">Показать смещения</label>
</div>
<p id="mode" aria-live="polite">Предварительный вариант · крупные острова без изменений</p>
</header>
<main>
<section class="map-stage" aria-label="Сравнение островов">
<img id="map" src="terrain-map-islands-preview-v2.png?v=programmatic-v2" alt="Карта с минимальными смещениями небольших островов" draggable="false">
<svg id="overlay" viewBox="0 0 3200 2200" preserveAspectRatio="none" aria-hidden="true">
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#ffe99b"/></marker></defs>
<g id="grid-lines"></g><g id="cell-labels"></g><g id="move-guides"></g>
</svg>
</section>
</main>
<script>
"use strict";
const namespace="http://www.w3.org/2000/svg";
const grid=document.querySelector("#grid-lines"),labels=document.querySelector("#cell-labels"),guides=document.querySelector("#move-guides");
function element(tag,attributes,parent){const node=document.createElementNS(namespace,tag);for(const [key,value] of Object.entries(attributes))node.setAttribute(key,value);parent.append(node);return node;}
const hexWidth=Math.sqrt(3)*80;
for(let r=0;r<Math.ceil((2200+80)/120);r++){
 const firstQ=Math.ceil(-0.5-r/2),lastQ=Math.floor(3200/hexWidth+0.5-r/2);
 for(let q=firstQ;q<=lastQ;q++){
  const x=hexWidth*(q+r/2),y=120*r;
  const points=Array.from({length:6},(_,i)=>{const angle=(60*i-30)*Math.PI/180;return (x+80*Math.cos(angle)).toFixed(2)+","+(y+80*Math.sin(angle)).toFixed(2);}).join(" ");
  element("polygon",{points},grid);
  element("text",{x,y:y+6},labels).textContent="Q"+q+" · R"+r;
 }
}
const movements=__ISLAND_MOVES__;
for(const move of movements){
 const [sx,sy]=move.original_center,[dx,dy]=move.translation_px;
 const x1=sx*3200/1508,y1=sy*2200/1043,x2=(sx+dx)*3200/1508,y2=(sy+dy)*2200/1043;
 element("circle",{cx:x1,cy:y1,r:7,fill:"none",stroke:"#ffe99b","stroke-width":2},guides);
 element("line",{x1,y1,x2,y2,stroke:"#ffe99b","stroke-width":3,"marker-end":"url(#arrow)"},guides);
}
const map=document.querySelector("#map"),before=document.querySelector("#before"),after=document.querySelector("#after");
function select(original){
 map.src=original?"../../../app/frontend/terrain-map-group3-artistic-v5-no-grid.png":"terrain-map-islands-preview-v2.png?v=programmatic-v2";
 map.alt=original?"Исходная карта Rhisseth":"Карта с минимальными смещениями небольших островов";
 before.setAttribute("aria-pressed",String(original));after.setAttribute("aria-pressed",String(!original));
 document.querySelector("#mode").textContent=original?"Оригинальная карта":"Предварительный вариант · крупные острова без изменений";
}
before.addEventListener("click",()=>select(true));after.addEventListener("click",()=>select(false));
document.querySelector("#grid").addEventListener("change",event=>grid.style.display=event.target.checked?"block":"none");
document.querySelector("#labels").addEventListener("change",event=>labels.style.display=event.target.checked?"block":"none");
document.querySelector("#moves").addEventListener("change",event=>guides.style.display=event.target.checked?"block":"none");
</script>
</body>
</html>
