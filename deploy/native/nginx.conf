# First test endpoint: self-signed TLS for the approved VPS IP.
include /etc/nginx/conf.d/rhisseth-whitelist.conf;
map $rhisseth_whitelisted $rhisseth_rate_key {
    default $binary_remote_addr;
    1 "";
}
limit_req_zone $rhisseth_rate_key zone=rhisseth_all:10m rate=3r/m;
limit_req_zone $rhisseth_rate_key zone=rhisseth_auth:10m rate=3r/m;
log_format rhisseth_security '$remote_addr [$time_iso8601] "$request_method $uri" $status $request_time "$http_user_agent"';
server {
    listen 80;
    listen [::]:80;
    server_name 62.113.109.168 rhisseth.ru;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 62.113.109.168 rhisseth.ru;
    ssl_certificate /opt/rhisseth/secrets/tls.crt;
    ssl_certificate_key /opt/rhisseth/secrets/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    # Cabinet and onboarding are intentionally shown in same-origin modal frames.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    access_log /opt/rhisseth/reports/nginx-access.log rhisseth_security;
    error_log /opt/rhisseth/reports/nginx-error.log;
    location ~ ^/(index|register)\.php$ {
        limit_req zone=rhisseth_all burst=3 nodelay;
        limit_req zone=rhisseth_auth burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ~* ^/(?:\.env|\.git|wp-admin|wp-login\.php|phpmyadmin|vendor|storage|backup|backups|config|server-status)(?:/|$) {
        return 444;
    }
    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 10m;
        add_header Cache-Control "public, max-age=600";
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        limit_req zone=rhisseth_all burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
