# First test endpoint: self-signed TLS for the approved VPS IP.
server {
    listen 80;
    listen [::]:80;
    server_name 62.113.109.168 rhisseth.ru;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 62.113.109.168 rhisseth.ru;
    ssl_certificate /opt/rhisseth/secrets/tls.crt;
    ssl_certificate_key /opt/rhisseth/secrets/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "Rhisseth test";
    auth_basic_user_file /opt/rhisseth/secrets/web.htpasswd;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    access_log /opt/rhisseth/reports/nginx-access.log;
    error_log /opt/rhisseth/reports/nginx-error.log;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
